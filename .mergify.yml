merge_queue:
  max_parallel_checks: 1
  checking_label: mergify-checking

queue_rules:
  - name: default
    merge_method: fast-forward
    update_method: rebase
    update_bot_account: tjwise99
    batch_size: 1
    queue_conditions:
      - "#commits = 1"
      - -draft

merge_protections_settings:
  auto_merge_conditions:
    - base = main
    - -draft
    - or:
        - author != wiseware-renovate[bot]
        - label = automerge

pull_request_rules:
  - name: squash a multi-commit pull request on its own branch
    conditions:
      - base = main
      - -draft
      - "#commits > 1"
    actions:
      squash:
        commit_message: all-commits
        bot_account: tjwise99

  - name: hand a Renovate pull request to whoever commits to it
    conditions:
      - author = wiseware-renovate[bot]
      - "#commits > 1"
    actions:
      label:
        add:
          - stop-updating
