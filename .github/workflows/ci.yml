name: ci
on:
  pull_request:
permissions: {}
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: test ! -e RED
  bench-pending:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - run: gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context=bench -f description="awaiting the build host"
